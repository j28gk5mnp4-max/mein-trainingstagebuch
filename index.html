<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mein Trainingstagebuch</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      margin: 0;
      padding: 24px;
    }

    main {
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      color: #155e75;
    }

    .karte {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 14px #00000012;
    }
  </style>
</head>
<body>
  <main>
    <h1>Mein Trainingstagebuch</h1>
    <p>Dein persönlicher Überblick über Training und Gewicht.</p>

    <section class="karte">
  <h2>Eintrag hinzufügen</h2>

  <label for="datum">Datum</label>
  <input type="date" id="datum">

  <label for="gewicht">Gewicht in kg</label>
  <input type="number" id="gewicht" step="0.1" placeholder="Zum Beispiel 87,5">

  <button type="button">Eintrag speichern</button>
</section>
