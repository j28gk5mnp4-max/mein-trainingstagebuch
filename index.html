<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mein Trainingstagebuch</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      margin: 0;
      padding: 24px;
    }

    main {
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      color: #155e75;
    }

    .karte {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 14px #00000012;
    }
  </style>
</head>
<body>
  <main>
    <h1>Mein Trainingstagebuch</h1>
    <p>Dein persönlicher Überblick über Training und Gewicht.</p>

    <section class="karte">
  <h2>Eintrag hinzufügen</h2>

  <label for="datum">Datum</label>
  <input type="date" id="datum">

  <label for="gewicht">Gewicht in kg</label>
  <input type="number" id="gewicht" step="0.1" placeholder="Zum Beispiel 87,5">

  <button type="button" id="speichern">Eintrag speichern</button>
</section>
           <section class="karte">
          <h2>Gespeicherte Gewichtseinträge</h2>
          <ul id="gewichtsliste"></ul>
        </section> 
         <section class="karte">
          <h2>Wochendurchschnitt</h2>
          <p id="wochendurchschnitt">Wird berechnet ...</p>
        </section>
  </main>

    <script>
      const datum = document.getElementById("datum");
      const jetzt = new Date();
      jetzt.setMinutes(jetzt.getMinutes() - jetzt.getTimezoneOffset());
      datum.value = jetzt.toISOString().slice(0, 10);
      
       const gewicht = document.getElementById("gewicht");
      const speichern = document.getElementById("speichern");
const gewichtsliste = document.getElementById("gewichtsliste");
const wochendurchschnitt = document.getElementById("wochendurchschnitt");
function eintraegeAnzeigen() {
  const eintraege = JSON.parse(localStorage.getItem("gewichtseintraege") || "[]");
  gewichtsliste.innerHTML = "";

  eintraege.slice().reverse().forEach(function(eintrag) {
    const li = document.createElement("li");
    li.textContent = new Date(eintrag.datum + "T00:00:00").toLocaleDateString("de-DE") + " - " + eintrag.gewicht.toFixed(1) + " kg";
    gewichtsliste.appendChild(li);
  });
}
function wochenDurchschnittBerechnen() {
  const eintraege = JSON.parse(localStorage.getItem("gewichtseintraege") || "[]");
  const heute = new Date();
  const tageSeitMontag = (heute.getDay() + 6) % 7;
  const montag = new Date(heute);
  montag.setDate(heute.getDate() - tageSeitMontag);
  montag.setHours(0, 0, 0, 0);

  const naechsterMontag = new Date(montag);
  naechsterMontag.setDate(montag.getDate() + 7);

  const tage = {};
  eintraege.forEach(function(eintrag) {
    const eintragsDatum = new Date(eintrag.datum + "T00:00:00");
    if (eintragsDatum >= montag && eintragsDatum < naechsterMontag) {
      tage[eintrag.datum] = eintrag.gewicht;
    }
  });

  const gewichte = Object.values(tage);
  if (gewichte.length === 0) {
    wochendurchschnitt.textContent = "Diese Woche noch keine Einträge.";
    return;
  }

  const summe = gewichte.reduce(function(gesamt, gewicht) {
    return gesamt + gewicht;
  }, 0);

  const durchschnitt = (summe / gewichte.length).toFixed(1).replace(".", ",");
  const wort = gewichte.length === 1 ? "Wiegetag" : "Wiegetage";
  wochendurchschnitt.textContent = "Ø " + durchschnitt + " kg aus " + gewichte.length + " " + wort;
}
eintraegeAnzeigen();
      wochenDurchschnittBerechnen();
      speichern.addEventListener("click", function () {
        const wert = Number(gewicht.value.replace(",", "."));

        if (!datum.value || !gewicht.value || !Number.isFinite(wert) || wert <= 0) {
          alert("Bitte Datum und ein gültiges Gewicht eingeben.");
          return;
        }

        const eintraege = JSON.parse(localStorage.getItem("gewichtseintraege") || "[]");
        eintraege.push({ datum: datum.value, gewicht: wert });
        localStorage.setItem("gewichtseintraege", JSON.stringify(eintraege));
eintraegeAnzeigen();
        wochenDurchschnittBerechnen();
        alert("Gewichtseintrag wurde auf diesem Gerät gespeichert.");
        gewicht.value = "";
      });</script>
  </body>
</html>
